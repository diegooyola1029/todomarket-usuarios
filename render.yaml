services:
  - type: web
    name: todomarket-usuarios-tercer-corte
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /v3/api-docs
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: SERVICE_TOKEN
        sync: false
      - key: INVENTORY_URL
        sync: false
      - key: INVENTORY_TOKEN
        sync: false
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: framework
